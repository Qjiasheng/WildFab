[tool.poetry]
package-mode = false
name = "wildfab"
version = "0.1.0"
description = "wildfab"
authors = ["QU Jiasheng <jsqu@mae.cuhk.edu.hk>"]
license = "MIT"
readme = "readme.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = ">=1.26,<2"
scikit-learn = "^1.7"
joblib = "^1.5"
setuptools = ">=68,<81"
wheel = "^0.45"
ninja = "^1.11"
potpourri3d = "^1.3"
pyqt5 = "^5.15.11"
pyvistaqt = "^0.11.3"
scikit-image = "^0.25.2"
torch-tb-profiler = "^0.4.3"
trimesh = "^4.9.0"
configargparse = "^1.7.1"
tqdm = "^4.67.1"
h5py = "^3.15.1"
pyyaml = "^6.0.3"
torch = { version = "2.3.1+cu121", source = "pytorch-cu121" }
torchvision = { version = "0.18.1+cu121", source = "pytorch-cu121" }
torchaudio = { version = "2.3.1+cu121", source = "pytorch-cu121" }
libigl = "^2.6.1"


[[tool.poetry.source]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
