

klein_config_defaults: &klein_defaults
  dataset: &klein_dataset_defaults
    save_path: "logs/fn_slice"
    point_cloud_path: "udf_data/logs/klein/mesh_data.xyz"
    mesh_path: "udf_data/logs/klein/mesh_data.obj"
    infill_surf_path: null   # No infill. can be .obj or .xyz (use wn for infill indication)
    batch_size: 5000
    num_batches: 10
    base_threshold: -0.95
    downsample: 1

    # used for testing
    udf_checkpoint_path: "logs/udf/klein/checkpoints/model_final.pth"
    resolution: 256
  optim:
    model_type: "sine"
    lr: 0.0001
    num_epochs: 100
    epochs_til_ckpt: 10
    steps_til_summary: 500


klein_fn:
  <<: *klein_defaults
  dataset:
    <<: *klein_dataset_defaults
    # init for fn training
    init_checkpoint_path: "logs/init_slice/klein_init/checkpoints/model_final.pth"
    # used for testing
    slice_checkpoint_path: "logs/fn_slice/klein_fn/checkpoints/model_final.pth"
  parameters:
    surf_grad_len: 60.0
    inside_grad_len: 0.0
    surf_dir: 60.0
    base_dir: 0.0
    veclap: 0.02
    hessian: 0.0




