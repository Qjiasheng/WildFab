fertility_config_defaults: &fertility_defaults
  dataset: &fertility_dataset_defaults
    save_path: "logs/fn_slice"
    point_cloud_path: "udf_data/logs/fertility/mesh_data.xyz"
    mesh_path: "udf_data/logs/fertility/mesh_data.obj"
    infill_surf_path: null   # No infill. can be .obj or .xyz (use wn for infill indication)
    batch_size: 10000
    num_batches: 10
    base_threshold: -0.95
    downsample: 1

    # used for testing
    udf_checkpoint_path: "logs/udf/fertility/checkpoints/model_final.pth"

    # to first get large th pcd w/o these pcd, then retrain with these pcd to improve the fn model
    # append large layer thickness pcd for next fn training. if needed, has to run test_slice.py first to generate the pcd
    append_large_th_pcd: True
    large_th_pcd_index_path: "logs/fn_slice/fertility_fn/large_th_pcd_index.npy"
    
    resolution: 256
  optim:
    model_type: "sine"
    lr: 0.0001
    num_epochs: 100
    epochs_til_ckpt: 10
    steps_til_summary: 500


fertility_fn:
