

klein_config_defaults: &klein_defaults
  dataset: &klein_dataset_defaults
    save_path: "logs/toolpath"
    point_cloud_path: "udf_data/logs/klein/mesh_data.xyz"
    mesh_path: "udf_data/logs/klein/mesh_data.obj"
    waypoint_filename: "waypoints.xyz"

    object_scale: 125.0
    base_threshold: -0.95

    udf_checkpoint_path: "logs/udf/klein/checkpoints/model_final.pth"
    slice_checkpoint_path: "logs/fn_slice/klein_fn/checkpoints/model_final.pth"
  optim:
    model_type: "sine"


klein_single_shell:
  <<: *klein_defaults
  type: "single_shell"
  parameters:
    connect_broken: True
    resolution: 128
    slice_num: 300  
    jump_threshold: 0.04 
    outer_down_ratio: 3.0 
    continuous_cnt_lim: 10000



