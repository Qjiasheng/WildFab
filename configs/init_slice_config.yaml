klein_config_defaults: &klein_defaults
  dataset: &klein_dataset_defaults
    save_path: "logs/init_slice"
    point_cloud_path: "udf_data/logs/klein/mesh_data.xyz"
    mesh_path: "udf_data/logs/klein/mesh_data.obj"
    batch_size: 5000               # can be adjusted based on total pcd number
    num_batches: 10
    base_threshold: -0.95
    downsample: 1
    height_checkpoint_path: "logs/udf/height/checkpoints/model_final.pth"

    # used for testing
    udf_checkpoint_path: "logs/udf/klein/checkpoints/model_final.pth"
    resolution: 256
  optim:
    model_type: "sine"
    lr: 0.0001
    num_epochs: 10
    epochs_til_ckpt: 50  
    steps_til_summary: 50


klein_init:
  <<: *klein_defaults
  dataset:
    <<: *klein_dataset_defaults
    # used for testing
    slice_checkpoint_path: "logs/init_slice/klein_init/checkpoints/model_final.pth"
  parameters:
    use_heat_grad: False
    grad: 0.0
    base_grad: 0.0
    laplace: 0.0001
    curv_align: 1.0
    heat_align: 0.0
    tangent: 3.0  



